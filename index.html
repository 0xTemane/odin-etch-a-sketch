<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Just Etch-a-Sketch!</title>
</head>
<body>
    <h1>Etch-a-Sketch</h1>
    <p>by <a href="https://github.com/0xTemane">0xTemane</a></p>
    <div class="btn-container">
        <button id="btn-grid-size">Change Grid Size</button>
        <button id="btn-toggle-border">Toggle Border</button>
        <button id="btn-reset">Reset</button>
    </div>
    <div class="grid-container"></div>
    <div class="color-container">
        <button class="color" id="btn-black">Black</button>
        <button class="color" id="btn-erase">Erase</button>
        <button class="color" id="btn-rainbow">Rainbow</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
